<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doors: a text game about Exit West</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  body { background: #111; color: #f2f2f2; font-family: 'Press Start 2p', cursive; margin: 0; padding: 24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px 0; }
  p.sub { color: #bbb;  font-family: 'Press Start 2p', cursive; font-size: 17px; line-height: 1.5; }
  #output { background: #000; border: 1px solid #444; padding: 18px; min-height: 260px; font-size: 13px; line-height: 1.6; white-space: pre-wrap; }
  #input { width: 100%; font-family: 'Press Start 2p', cursive; box-sizing: border-box; margin-top: 12px; padding: 14px; font-size: 14px; background: #222; color: #fff; border: 1px solid #666; border-radius: 8px; }
  #restart { margin-top: 12px; font-family: 'Press Start 2p', cursive; padding: 12px 18px; font-size: 18px; background: #333; color: #fff; border: 1px solid #666; border-radius: 8px; cursor: pointer; }
  .note { color: #aaa; font-size: 14px; line-height: 1.5; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Doors: a text game about Exit West</h1>
  <p class="sub">How to play: read the story, type 1 or 2, then press Enter. You get a choice at each step. After 1, you get another choice. When you reach an ending, press Restart to play again.</p>
  <div id="output"></div>
  <input id="input" placeholder="Type 1 or 2, then press Enter" autocomplete="off">
  <button id="restart">Restart</button>
</div>
<script>
  const output = document.getElementById("output");
  const inputBox = document.getElementById("input");
  const restartButton = document.getElementById("restart");
  
  let gameOver = false;
  // Where are you in the story? Starts at "start", then changes.
  // This is how you go deeper: after one choice, you are in a new scene,
  let scene = "start";

  // tick() 
  let audioCtx = null;
  function tick() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = 225;
      g.gain.value = 0.03;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.02);
    } catch (e) {}
  }

  // typeText() types text out one character at a time, then calls done().
  function typeText(text, done) {
    let i = 0;
    inputBox.disabled = true;
    const timer = setInterval(() => {
      output.textContent += text[i];
      if (i % 2 === 0) tick();
      output.scrollTop = output.scrollHeight;
      i++;
      if (i >= text.length) {
        clearInterval(timer);
        output.textContent += "\n\n";
        if (done) done();
      }
    }, 12);
  }

  function getIntro() {
    return `Saeed and Nadia meet in an evening class. Saeed is traditional and lives at home with his parents. Nadia is independent, lives alone, and her parents disowned her for it. They fall in love.
At first the city is tense but not at war. It is filling with refugees. Then the militants start taking over. Saeed's mother is killed by a stray bullet while she is looking for a lost earring in the family car. Nadia moves in with Saeed and his father to help.
They both lose their jobs. Violence becomes everyday. Rumors spread about black doors that can take you to another country in an instant.` + "In this choose your own adventure, you take the place of Saeed and will choose his choices at various times throughout the book, by entering 1 or 2.\n"
      + "After hearing that your father has chosen to stay in the city as to not leave the place he has lived his entire life with your mother. You have the choice to either continue on your plan to leave the city and go through the door with Nadia or to stay with your father. What do you do? (1 or 2)";
  }
  // READ IF COLE B
  // The whole game. One input in, one text out.
  // Error checking: only 1 or 2 are valid. Anything else gets an error.
  // HOW TO GO DEEPER: check which scene you are in, then check the choice.
  // To add a new step, add a new scene name, set scene = "yourScene",
  // then add: if (scene === "yourScene") { if (choice === 1) { ... } else { ... } }
  // To add a third choice in a scene, use: else if (choice === 3) { ... }
  function respond(input) {
    if (gameOver) return "The game is over. Press Restart to play again.";
    const choice = parseInt(input.trim(), 10);
    if (isNaN(choice) || (choice !== 1 && choice !== 2)) return "Please enter 1 or 2.";
    if (scene === "start") {
      if (choice === 1) {
        scene = "mykonos";
        return "You choose to continue on with your plan to go through the door with Nadia. When you go through the door, you arrive in Mykonos and begin living in the refugee camp there.\n\nWhat do you do? (1) Take another door to London. (2) Stay in Mykonos.";
      } else {
        scene = "afterfather";
        return "You choose to abandon your plan with Nadia and stay with your father. Nadia is angry with you, but has to leave quickly in order to meet up with the agent. You spend the next few months with your father, always in fear of the militants deciding to kill you, or of the fighting starting up again. After a few months, your father contracts pneumonia and dies, leaving you alone. You begin having doubts about not going with Nadia when you had the chance, and you imagine how life would be if you had chosen to go.\n\nYou are alone now. What do you do? (1) Go through a door to find Nadia. (2) Stay in the city.";
      }
    }
    if (scene === "afterfather") {
      if (choice === 1) {
        scene = "mykonos";
        return "You find an agent and pay for a door. You step through and arrive in Mykonos. Nadia is there, living in the refugee camp. You find her, and you are together again.\n\nWhat do you do? (1) Take another door to London. (2) Stay in Mykonos.";
      } else {
        gameOver = true;
        return "You stay in the city. The fighting goes on. You are alone, and you keep wondering what happened to Nadia.\n\nThe end.";
      }
    }
    if (scene === "mykonos") {
      if (choice === 1) {
        scene = "london";
        return "A local Greek girl who volunteers at the clinic has become friends with Nadia. She tells you about a door that leads to London, and she helps you through it. You step through and arrive in a grand, empty mansion, where dozens of other migrants are already settling in. After a while, a crowd of nativists gathers outside, shouting. The police come too.\n\nWhat do you do? (1) Stay inside the mansion with the others. (2) Go outside and confront the crowd.";
      } else {
        scene = "mykonosstay";
        return "You stay in Mykonos, living in the tent city. Nadia spends her days at the clinic, where she has become friends with a local Greek girl who volunteers there. What do you do? (1) Find work and build a life here. (2) Keep waiting for a door.";
      }
    }
    if (scene === "mykonosstay") {
      if (choice === 1) {
        gameOver = true;
        return "You find work in the camp. You help the other refugees, and you build a small life here with Nadia. It is not the life you imagined, but it is a life.\n\nThe end.";
      } else {
        scene = "london";
        return "You keep waiting. After a while, the Greek girl from the clinic takes you to a door. You step through and arrive in a grand, empty mansion, where dozens of other migrants are already settling in. After a while, a crowd of nativists gathers outside, shouting. The police come too.\n\nWhat do you do? (1) Stay inside the mansion with the others. (2) Go outside and confront the crowd.";
      }
    }
    if (scene === "london") {
      if (choice === 1) {
        scene = "halo";
        return "You stay inside with the others. The standoff lasts for days. In the end, the migrants are sectioned off into a ghetto called Dark London, with little food and little electricity. Later, you are put to work clearing land for a new city called Halo London. You are promised a small plot of land and a pipe. You and Nadia throw yourselves into the work, and you feel yourselves growing apart. Between the exhaustion and the way your romance is fading, you fall into a rut. One night, Nadia suggests you leave through another door, to Marin, in California.\n\nWhat do you do? (1) Go to Marin with Nadia. (2) Stay in London.";
      } else {
        gameOver = true;
        return "You go outside to confront the crowd. You are caught in the street fighting, and you are hurt. Nadia is hurt too. The mansion is no longer safe.\n\nThe end.";
      }
    }
    if (scene === "halo") {
      if (choice === 1) {
        scene = "marin";
        return "You agree, and you go through another door. You arrive in Marin County, California, and build a shanty on a hillside above the bay. You are welcome here. Nadia finds work at a food cooperative down the hill, and you join a religious community led by a Black preacher. But you feel yourselves growing further apart. One night, Nadia says you should go your separate ways.\n\nWhat do you do? (1) Agree it is for the best. (2) Ask her to stay.";
      } else {
        gameOver = true;
        return "You stay in London. You keep working for Halo London, and you are given your small plot of land and your pipe. But you and Nadia have grown apart, and you never leave.\n\nThe end.";
      }
    }
    if (scene === "marin") {
      if (choice === 1) {
        scene = "final";
        return "You agree it is for the best. Without embracing you, Nadia packs her things and leaves. She moves into a spare room at the food cooperative and begins a relationship with a cook who works there. You grow closer to the preacher's daughter, and you start dating. You marry her. Fifty years pass. One day, Nadia returns to the city you once fled from together, and you meet again in a caf\u00e9.\n\nWhat do you do? (1) Offer to take her to see the stars in Chile one day. (2) Say goodbye and part ways.";
      } else {
        gameOver = true;
        return "You ask her to stay. She agrees, for now. You stay together in Marin, in the shanty above the bay, and you build a life there. It is not the life you imagined, but it is a life together.\n\nThe end.";
      }
    }
    if (scene === "final") {
      gameOver = true;
      if (choice === 1) {
        return "You offer to take her to see the stars in Chile one day. Fifty years after you fled together, you are sitting across from each other again.\n\nThe end.";
      } else {
        return "You say goodbye. You part ways, and you do not see each other again.\n\nThe end.";
      }
    }
    return "Please enter 1 or 2.";
  }

  function startGame() {
    gameOver = false;
    scene = "start";
    output.textContent = "";
    inputBox.value = "";
    typeText(getIntro(), () => {
      inputBox.disabled = false;
      inputBox.focus();
    });
  }

  startGame();

  const endingNote = "Exit West connects to current events because it explores what happens when people are forced to leave their homes and seek safety somewhere else. Saeed and Nadia become migrants because remaining in their home country becomes dangerous, and they have little control over the circumstances that force them to leave. This is similar to current debates about asylum in the United States, where people fleeing danger seek protection but face policies that can restrict their ability to enter or remain in the country.";

  inputBox.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (inputBox.disabled) return;
    const text = inputBox.value;
    inputBox.value = "";
    if (text.trim() === "") return;
    output.textContent += "> " + text + "\n\n";
    const reply = respond(text);
    if (reply === "Please enter 1 or 2." || reply === "The game is over. Press Restart to play again.") {
      output.textContent += reply + "\n\n";
      inputBox.disabled = false;
      inputBox.focus();
      return;
    }
    const toShow = gameOver ? reply + "\n\n" + endingNote : reply;
    typeText(toShow, () => {
      inputBox.disabled = gameOver;
      if (!gameOver) inputBox.focus();
    });
  });

  restartButton.addEventListener("click", startGame);
</script>
</body>
</html>
