<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doors: a text game about Exit West</title>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
<style>
  body { background: #111; color: #f2f2f2; margin: 0; padding: 24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px 0; }
  p.sub { color: #bbb; font-size: 17px; line-height: 1.5; }
  #output { background: #000; border: 1px solid #444; padding: 18px; min-height: 260px; font-size: 19px; line-height: 1.6; white-space: pre-wrap; }
  #input { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 14px; font-size: 18px; background: #222; color: #fff; border: 1px solid #666; border-radius: 8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Doors: a text game about Exit West</h1>
  <p class="sub">Please wait a few seconds, then type a command and press Enter.</p>
  <input id="input" placeholder="Type a command, then press Enter" autocomplete="off" disabled>
</div>
<script type="module">
  const output = document.getElementById("output");
  const inputBox = document.getElementById("input");

  function print(text) {
    output.textContent += text + "\n\n";
    output.scrollTop = output.scrollHeight;
  }

  await cheerpjInit();
  const cj = await cheerpjRunLibrary("/app/Game.jar");
  const Game = await cj.Game;
  const game = await new Game();

  output.textContent = "";
  print(await game.getIntro());
  print(await game.respond("look"));
  inputBox.disabled = false;
  inputBox.focus();

  inputBox.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter") return;
    const text = inputBox.value;
    inputBox.value = "";
    if (text.trim() === "") return;
    print("> " + text);
    const reply = await game.respond(text);
    print(reply);
  });
</script>
</body>
</html>
