<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doors: a text game about Exit West</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
  body { background: #111; color: #f2f2f2; font-family: 'Press Start 2p', cursive; margin: 0; padding: 24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px 0; }
  p.sub { color: #bbb; font-size: 17px; line-height: 1.5; }
  #output { background: #000; border: 1px solid #444; padding: 18px; min-height: 260px; font-size: 19px; line-height: 1.6; white-space: pre-wrap; }
  #input { width: 100%; font-family: 'Press Start 2p', cursive; box-sizing: border-box; margin-top: 12px; padding: 14px; font-size: 18px; background: #222; color: #fff; border: 1px solid #666; border-radius: 8px; }
  #restart { margin-top: 12px; font-family: 'Press Start 2p', cursive; padding: 12px 18px; font-size: 18px; background: #333; color: #fff; border: 1px solid #666; border-radius: 8px; cursor: pointer; }
  .note { color: #aaa; font-size: 14px; line-height: 1.5; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Doors: a text game about Exit West</h1>
  <p class="sub">How to play: read the story, type 1 or 2, then press Enter. You get a choice at each step. After 1, you get another choice. When you reach an ending, press Restart to play again.</p>
  <div id="output"></div>
  <input id="input" placeholder="Type 1 or 2, then press Enter" autocomplete="off">
  <button id="restart">Restart</button>
</div>
<script>
  const output = document.getElementById("output");
  const inputBox = document.getElementById("input");
  const restartButton = document.getElementById("restart");
  
  let gameOver = false;
  // Where are you in the story? Starts at "start", then changes.
  // This is how you go deeper: after one choice, you are in a new scene,
  let scene = "start";

  // tick() 
  let audioCtx = null;
  function tick() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.frequency.value = 200;
      g.gain.value = 0.03;
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start();
      o.stop(audioCtx.currentTime + 0.02);
    } catch (e) {}
  }

  // typeText() types text out one character at a time, then calls done().
  function typeText(text, done) {
    let i = 0;
    inputBox.disabled = true;
    const timer = setInterval(() => {
      output.textContent += text[i];
      if (i % 2 === 0) tick();
      output.scrollTop = output.scrollHeight;
      i++;
      if (i >= text.length) {
        clearInterval(timer);
        output.textContent += "\n\n";
        if (done) done();
      }
    }, 12);
  }

  function getIntro() {
    return "In this choose your own adventure, you take the place of Saeed and will choose his choices at various times throughout the book, by entering 1 or 2.\n"
      + "After hearing that your father has chosen to stay in the city as to not leave the place he has lived his entire life with your mother. You have the choice to either continue on your plan to leave the city and go through the door with Nadia or to stay with your father. What do you do? (1 or 2)";
  }
  // READ IF COLE B
  // The whole game. One input in, one text out.
  // Error checking: only 1 or 2 are valid. Anything else gets an error.
  // HOW TO GO DEEPER: check which scene you are in, then check the choice.
  // To add a new step, add a new scene name, set scene = "yourScene",
  // then add: if (scene === "yourScene") { if (choice === 1) { ... } else { ... } }
  // To add a third choice in a scene, use: else if (choice === 3) { ... }
  function respond(input) {
    if (gameOver) return "The game is over. Press Restart to play again.";
    const choice = parseInt(input.trim(), 10);
    if (isNaN(choice) || (choice !== 1 && choice !== 2)) return "Please enter 1 or 2.";
    if (scene === "start") {
      if (choice === 1) {
        scene = "mykonos";
        return "You choose to continue on with your plan to go through the door with Nadia. When you go through the door, you arrive in Mykonos and begin living in the refugee camp there.\n\nWhat do you do? (1) Take another door to London. (2) Stay in Mykonos.";
      } else {
        gameOver = true;
        return "You choose to abandon your plan with Nadia and stay with your father. Nadia is angry with you, but has to leave quickly in order to meet up with the agent. You spend the next few months with your father, always in fear of the militants deciding to kill you, or of the fighting starting up again. After a few months, your father contracts pneumonia and dies, leaving you alone. You begin having doubts about not going with Nadia when you had the chance, and imagine how life would be if you had chosen to go.\n\nThe end.";
      }
    }
    if (scene === "mykonos") {
      gameOver = true;
      if (choice === 1) {
	 scene = "london";
        return "You take another door to London, and begin living in an abandoned large mansion with dozens of other refugees from around the world. \n\nWhat do you do? (1) Take another door to California. (2) Stay in London.";
      } else {
	   gameOver = true;
        return "You stay in Mykonos, living in the refugee camp and waiting, wondering what life in London would have been like.\n\nThe end.";
      }
    }
    if (scene === "london") {
	if (choice === 1) {
	   scene = "california";
	   return "You and Nadia arrive in California after going through the door. You are relieved to be in what seems like a more calming and safe area, and begin to settle  down. Over time, you and Nadia grow apart and eventually decide to 'break up' and begin living seperate lives. One day 50 years later, in the country of your birth you hear that she had come back to visit her childhood home, and you wonder if you should reach out to start a meeting. \n\nWhat do you do? (1) Meet up with her for the first time in 50 years. (2) Don't meet up and continue on your seperate lives.";
	    }
	else {
	  gameOver = true;
        return "You stay in London, living in the abandoned mansion with dozens of other migrants, as the nativists become more aggressive. You begin to wonder what life would have been like in Californa with Nadia.\n\nThe end.";
	}
    }
  if (scene === "california") {
	if (choice === 1) {
	   scene = "birthCountry";
	   return "You choose meet up with her again,and as you are talking about the past,you begin to wonder what life could have been like had you made different choices.\n\nThe end";
	    }
	else {
	  gameOver = true;
        return "You choose not to meet up with Nadia, prefering to continue with your own life instead of going back into the past and wondering what could have been.\n\nThe end.";
	}
    }

    return "Please enter 1 or 2.";
  }

  function startGame() {
    gameOver = false;
    scene = "start";
    output.textContent = "";
    inputBox.value = "";
    typeText(getIntro(), () => {
      inputBox.disabled = false;
      inputBox.focus();
    });
  }

  startGame();

  inputBox.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    if (inputBox.disabled) return;
    const text = inputBox.value;
    inputBox.value = "";
    if (text.trim() === "") return;
    output.textContent += "> " + text + "\n\n";
    const reply = respond(text);
    if (reply === "Please enter 1 or 2." || reply === "The game is over. Press Restart to play again.") {
      output.textContent += reply + "\n\n";
      inputBox.disabled = false;
      inputBox.focus();
      return;
    }
    typeText(reply, () => {
      inputBox.disabled = gameOver;
      if (!gameOver) inputBox.focus();
    });
  });

  restartButton.addEventListener("click", startGame);
</script>
</body>
</html>
