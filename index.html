<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Doors: a text game about Exit West</title>
<style>
  body { background: #111; color: #f2f2f2; font-family: Georgia, serif; margin: 0; padding: 24px; }
  .wrap { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 8px 0; }
  p.sub { color: #bbb; font-size: 17px; line-height: 1.5; }
  #output { background: #000; border: 1px solid #444; padding: 18px; min-height: 260px; font-size: 19px; line-height: 1.6; white-space: pre-wrap; }
  #input { width: 100%; box-sizing: border-box; margin-top: 12px; padding: 14px; font-size: 18px; background: #222; color: #fff; border: 1px solid #666; border-radius: 8px; }
  .note { color: #aaa; font-size: 14px; line-height: 1.5; margin-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Doors: a text game about Exit West</h1>
  <p class="sub">Type 1 or 2 and press Enter.</p>
  <div id="output"></div>
  <input id="input" placeholder="Type 1 or 2, then press Enter" autocomplete="off">
  <p class="note">The game logic is in Game.java, compiled to JavaScript with TeaVM (game.js). This page is only the display and the input box.</p>
</div>
<script type="module">
  import { getIntro, respond } from "./game.js";

  const output = document.getElementById("output");
  const inputBox = document.getElementById("input");

  function print(text) {
    output.textContent += text + "\n\n";
    output.scrollTop = output.scrollHeight;
  }

  print(getIntro());
  inputBox.focus();

  inputBox.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const text = inputBox.value;
    inputBox.value = "";
    if (text.trim() === "") return;
    print("> " + text);
    print(respond(text));
  });
</script>
</body>
</html>
