name: Build Game.jar
on:
  push:
    branches: [main]
    paths: ['Game.java']
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: javac Game.java && jar cf Game.jar Game.class
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add Game.jar
          git diff --cached --quiet || git commit -m "Build Game.jar from Game.java"
          git push
